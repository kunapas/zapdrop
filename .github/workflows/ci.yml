name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install libmtp and libusb headers
        run: apt-get update -qq && apt-get install -y -qq libmtp-dev libusb-1.0-0-dev pkg-config
      - name: Test
        run: swift test --parallel

  macos:
    name: macOS build, tests and app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Build tools for libmtp/libusb
        run: brew install autoconf automake libtool pkg-config gettext
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: Vendor/build
          key: deps-${{ runner.os }}-${{ hashFiles('Scripts/config.sh', 'Scripts/build-deps.sh') }}
      - name: Build libmtp + libusb (universal)
        run: test -f Vendor/build/prefix/lib/libmtp.9.dylib || Scripts/build-deps.sh
      - name: Unit tests
        run: swift test --parallel
      - name: Build app bundle (SwiftPM, ad-hoc signed)
        run: Scripts/build-app.sh
      - name: Build Xcode project
        run: xcodebuild -project App/Ferry.xcodeproj -scheme Ferry -configuration Debug -destination 'platform=macOS' build | tail -n 30
      - name: Launch smoke test (demo mode)
        run: |
          dist/Ferry.app/Contents/MacOS/Ferry --mock &
          PID=$!
          sleep 8
          kill -0 $PID   # still running = launched without crashing
          kill $PID
      - name: DMG (unsigned)
        run: Scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ferry-unsigned
          path: |
            dist/*.dmg
            dist/*.sha256

  demo-build:
    name: Demo build without libmtp (FERRY_MOCK_ONLY)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: FERRY_MOCK_ONLY=1 FERRY_ARCHS=arm64 Scripts/build-app.sh
